{% load i18n %}
<div class="db-legend"><span><i style="background:var(--jh-accent)"></i>{% trans "ページビュー" %}</span><span><i style="background:#64d2ff"></i>{% trans "訪問者" %}</span></div>
<div class="db-chart" role="img" aria-label="{% trans '日別のページビュー' %}">
    {% for d in series %}
    <div class="db-chart-col" title="{{ d.date|date:'Y/m/d' }}  {% trans 'ページビュー' %} {{ d.views }} / {% trans '訪問者' %} {{ d.visitors }}">
        <div class="db-chart-bar" style="height: {{ d.pct|stringformat:'s' }}%;"></div>
        <div class="db-chart-bar db-chart-bar--visitors" style="height: {{ d.visitor_pct|stringformat:'s' }}%;"></div>
    </div>
    {% endfor %}
</div>
<div class="db-chart-axis"><span>{{ series.0.date|date:"n/j" }}</span>{% with last=series|last %}<span>{{ last.date|date:"n/j" }}</span>{% endwith %}</div>
