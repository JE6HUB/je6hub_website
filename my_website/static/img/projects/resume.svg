<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Y.K. Nexus Resume">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c0b2e"/>
      <stop offset="1" stop-color="#06050a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#bf5af2" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#bf5af2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#bg)"/>
  <rect width="800" height="520" fill="url(#glow)"/>
  <!-- browser window -->
  <g transform="translate(70 60)">
    <rect width="660" height="400" rx="22" fill="#111114" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="28" cy="26" r="7" fill="#ff5f57"/><circle cx="50" cy="26" r="7" fill="#febc2e"/><circle cx="72" cy="26" r="7" fill="#28c840"/>
    <rect x="200" y="16" width="260" height="20" rx="10" fill="#2c2c2e"/>
    <line x1="0" y1="52" x2="660" y2="52" stroke="#ffffff" stroke-opacity="0.08"/>
    <!-- profile glass card -->
    <rect x="40" y="90" width="260" height="270" rx="24" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.2"/>
    <circle cx="170" cy="170" r="48" fill="#bf5af2"/>
    <text x="170" y="184" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#fff" text-anchor="middle">YK</text>
    <rect x="90" y="240" width="160" height="14" rx="7" fill="#f5f5f7"/>
    <rect x="110" y="266" width="120" height="10" rx="5" fill="#8e8e93"/>
    <g transform="translate(78 300)">
      <rect width="56" height="26" rx="13" fill="#64d2ff" fill-opacity="0.25"/>
      <rect x="64" width="56" height="26" rx="13" fill="#ff375f" fill-opacity="0.25"/>
      <rect x="128" width="56" height="26" rx="13" fill="#30d158" fill-opacity="0.25"/>
    </g>
    <!-- code lines -->
    <g font-family="Menlo, Consolas, monospace" font-size="16">
      <text x="340" y="115" fill="#bf5af2">class</text><text x="395" y="115" fill="#64d2ff">ResumeView</text><text x="495" y="115" fill="#f5f5f7">(View):</text>
      <text x="364" y="145" fill="#bf5af2">def</text><text x="400" y="145" fill="#ffd60a">get</text><text x="432" y="145" fill="#f5f5f7">(self, request):</text>
      <text x="388" y="175" fill="#bf5af2">return</text><text x="452" y="175" fill="#64d2ff">render</text><text x="512" y="175" fill="#f5f5f7">(</text>
      <text x="412" y="205" fill="#f5f5f7">request,</text>
      <text x="412" y="235" fill="#ff9f0a">"core/resume.html"</text>
      <text x="388" y="265" fill="#f5f5f7">)</text>
    </g>
    <rect x="340" y="300" width="270" height="10" rx="5" fill="#3a3a3c"/>
    <rect x="340" y="322" width="220" height="10" rx="5" fill="#3a3a3c"/>
    <rect x="340" y="344" width="240" height="10" rx="5" fill="#3a3a3c"/>
  </g>
</svg>
