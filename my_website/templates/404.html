{% load static i18n %}{% get_current_language as LANGUAGE_CODE %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet" />
</head>
<body>
    <main class="d-flex align-items-center justify-content-center" style="min-height:100vh; padding: 24px;">
        <div class="jh-glass-panel p-5 text-center" style="max-width:480px; width: 100%;">
            <div class="mx-auto mb-4" style="width: 80px; height: 80px; border-radius: 20px; background: rgba(255,159,10,0.15); display: flex; align-items: center; justify-content: center;">
                <span class="material-symbols-outlined" style="font-size: 40px; color: var(--jh-orange);">error</span>
            </div>
            <h1 class="jh-hero-title mb-3" style="font-size: 48px;">404</h1>
            <p class="jh-subhead mb-5" style="font-size: 15px;">{% trans "お探しのページは見つかりませんでした。" %}</p>
            <a href="/" class="jh-btn jh-btn-primary d-inline-flex align-items-center justify-content-center" style="padding: 14px 32px; font-size: 16px;">
                {% trans "トップへ戻る" %}
            </a>
        </div>
    </main>
</body>
</html>
