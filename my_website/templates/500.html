{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet" />
</head>
<body>
    <main class="d-flex align-items-center justify-content-center" style="min-height:100vh; padding: 24px;">
        <div class="ap-glass-panel p-5 text-center" style="max-width:480px; width: 100%;">
            <div class="mx-auto mb-4" style="width: 80px; height: 80px; border-radius: 20px; background: rgba(255,59,48,0.15); display: flex; align-items: center; justify-content: center;">
                <span class="material-symbols-outlined" style="font-size: 40px; color: #ff3b30;">warning</span>
            </div>
            <h1 class="ap-hero-title mb-3" style="font-size: 48px;">500</h1>
            <p class="ap-subhead mb-5" style="font-size: 15px;">サーバーで問題が発生しました。しばらくしてから再度お試しください。</p>
            <a href="/" class="ap-btn ap-btn-primary d-inline-flex align-items-center justify-content-center" style="padding: 14px 32px; font-size: 16px;">
                <span class="material-symbols-outlined me-2" style="font-size: 20px;">home</span>
                トップへ戻る
            </a>
        </div>
    </main>
</body>
</html>
