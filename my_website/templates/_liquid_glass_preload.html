{% load static %}
{# LiquidGlass ライブラリとページのキービジュアルを HTML 解析と並行して早めに取得する #}
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/@ybouane/liquidglass@1.0.3/dist/index.js">
{% if hero %}<link rel="preload" as="image" fetchpriority="high" imagesizes="100vw"
      imagesrcset="{% static hero|add:'-1280.jpg' %} 1280w, {% static hero|add:'-1920.jpg' %} 1920w, {% static hero|add:'-2560.jpg' %} 2560w">{% endif %}
